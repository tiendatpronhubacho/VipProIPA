workflows:
  tiendat-unsigned-ipa:
    name: TienDat unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Build iOS app without code signing
        script: |
          set -euo pipefail
          xcodebuild -version
          # The ZIP/repository contains a top-level VipProIPA directory.
          # Support both repository-root and VipProIPA-root build configurations.
          if [ -d "$CM_BUILD_DIR/VipProIPA/OriginalXcode/ThreeOneOSFive.xcodeproj" ]; then
            PROJECT_PATH="$CM_BUILD_DIR/VipProIPA/OriginalXcode/ThreeOneOSFive.xcodeproj"
          elif [ -d "$CM_BUILD_DIR/OriginalXcode/ThreeOneOSFive.xcodeproj" ]; then
            PROJECT_PATH="$CM_BUILD_DIR/OriginalXcode/ThreeOneOSFive.xcodeproj"
          else
            echo "ERROR: ThreeOneOSFive.xcodeproj not found under CM_BUILD_DIR=$CM_BUILD_DIR"
            find "$CM_BUILD_DIR" -maxdepth 5 -name ThreeOneOSFive.xcodeproj -print
            exit 1
          fi
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme OGIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/TienDatDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH="$CM_BUILD_DIR/TienDatDerivedData/Build/Products/Release-iphoneos/OGIOS.app"
          test -d "$APP_PATH"
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/ipa/Payload/OGIOS.app"
          (cd "$CM_BUILD_DIR/ipa" && /usr/bin/zip -qry "$CM_BUILD_DIR/TienDat-unsigned.ipa" Payload)
          test -s "$CM_BUILD_DIR/TienDat-unsigned.ipa"
    artifacts:
      - $CM_BUILD_DIR/TienDat-unsigned.ipa
