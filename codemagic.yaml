workflows:
  tiendat-ios:
    name: TIENDAT iOS (3106 base)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.qingtang.3106
      vars:
        XCODE_PROJECT: "ThreeOneOSSix.xcodeproj"
        XCODE_SCHEME: "3106"
        BUNDLE_ID: "com.qingtang.3106"
      xcode: latest

    scripts:
      - name: Select signing profiles
        script: |
          xcode-project use-profiles

      - name: Show Xcode project configuration
        script: |
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Build and export IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

